[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "telegram-ping-mcp"
version = "0.7.0"
description = "Bidirectional Telegram bot MCP with verified users, messages and attachments"
requires-python = ">=3.12"
dependencies = ["mcp>=1.26,<2", "httpx>=0.28,<1", "uvicorn>=0.35,<1", "python-dotenv>=1.1,<2"]

[project.scripts]
telegram-ping-mcp = "telegram_ping_mcp.__main__:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--basetemp=temp/pytest"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.hatch.build.targets.wheel]
packages = ["src/telegram_ping_mcp"]
